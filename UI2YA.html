<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ec">
  <meta name="description" content="UI2YA — UI 컴포넌트, 디자인 스타일, 모션 프리셋을 직접 체험하고 AI 개발 지시문으로 가져가는 인터랙티브 백과사전.">
  <title>UI2YA — Interface & Motion Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23424bc6'/%3E%3Cg fill='none' stroke='white'%3E%3Crect x='7' y='7' width='13' height='15' rx='3' opacity='.55'/%3E%3Crect x='12' y='11' width='13' height='15' rx='3'/%3E%3C/g%3E%3C/svg%3E">
  <style>
:root{color-scheme:light;--bg:#f4f3ec;--paper:#fffef8;--ink:#1f2a23;--muted:#536358;--line:#d5dacf;--strong:#245944;--soft:#deeee1;--nav:#1c2822;--bright:#d5ed9d;--warm:#f4ead5;--focus:#357f61;--ui:"DM Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.57 var(--ui);letter-spacing:-.012em}
button,input,select,textarea{font:inherit;letter-spacing:inherit}
a{color:inherit;text-underline-offset:.18em}
button,a,input,select,textarea,summary{touch-action:manipulation}
button{cursor:pointer}
button:disabled{opacity:.48;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
h1,h2,h3,p,dl,ul{margin:0}
h1,h2,h3{line-height:1.24;letter-spacing:-.045em}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--strong)}
input:not([type=range],[type=checkbox],[type=radio],[type=color]),select,textarea{max-width:100%;min-width:0;border:1px solid #bac7ba;background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 10px}
input[type=range]{width:100%;min-height:28px}
input[type=checkbox],input[type=radio]{width:17px;height:17px}
input[type=color]{min-height:42px;max-width:100%;cursor:pointer}
textarea{resize:vertical}
select{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:fixed;top:10px;left:10px;transform:translateY(-180%);background:var(--bright);color:var(--nav);z-index:99;padding:10px 15px;border-radius:7px}
.skip:focus{transform:none}
.rail{position:fixed;inset:0 auto 0 0;z-index:4;width:224px;background:var(--nav);color:#f3f6ee;display:flex;flex-direction:column;padding:33px 19px 20px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-size:16px;font-weight:800;line-height:1.25;padding:0 5px 30px;white-space:nowrap}
.brand small{display:block;font:10px/1.4 var(--mono);letter-spacing:.09em;color:#b1c5b7;margin-top:5px}
.brand-mark{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--bright);color:#23372b;border-radius:10px;position:relative}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;width:15px;height:13px;border:1.5px solid currentColor;border-radius:2px;transform:rotate(-12deg) translate(-1px,1px)}
.brand-mark::after{transform:rotate(-12deg) translate(3px,-3px);background:var(--bright)}
.rail nav{display:grid;gap:6px}
.rail nav a{min-height:46px;display:flex;align-items:center;gap:12px;text-decoration:none;border:1px solid transparent;color:#d7e2d8;border-radius:9px;padding:8px 11px;font-size:14px;font-weight:650}
.rail nav a span{width:22px;text-align:center;font-size:21px;font-weight:500;color:#a9c2b0;line-height:1}
.rail nav a:hover{background:#2c4033}
.rail nav a[aria-current=page]{background:#354b3e;border-color:#486252;color:#f8faf5}
.rail nav a[aria-current=page] span{color:var(--bright)}
.rail-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;border-top:1px solid #415349;padding:16px 2px 0;font-size:12px;color:#bbccbf}
.rail-footer span{font:11px var(--mono);color:var(--bright)}
.page{margin-left:224px;min-width:0}
.topbar{height:73px;padding:0 clamp(18px,4vw,54px);border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;gap:15px;align-items:center}
.location{font-size:13px;color:#425547;font-weight:750;white-space:nowrap}
#global-search{display:flex;align-items:center;gap:9px;border:1px solid #cbd5ca;padding:3px 5px 3px 13px;border-radius:11px;background:var(--paper);width:min(390px,100%)}
#global-search input{width:100%;border:0;background:transparent;padding:7px 1px;font-size:13px;outline-offset:0}
.search-symbol{width:12px;height:12px;border:1.5px solid #627c69;border-radius:50%;position:relative;flex:none}
.search-symbol::after{content:"";position:absolute;height:1.5px;width:5px;background:#627c69;transform:rotate(45deg);right:-4px;bottom:-2px}
.search-enter{border:0;border-radius:6px;background:#e9eee3;color:#365744;font-size:12px;font-weight:700;padding:5px 9px;flex:none}
main{max-width:1550px;margin:auto;padding:29px clamp(18px,4vw,54px) 54px;min-width:0;scroll-margin-top:73px}
main:focus{outline:none}
.hero{min-height:355px;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);border-radius:19px;background:#21372d;color:#f2f8e8;overflow:hidden;isolation:isolate}
.hero-text{padding:43px clamp(23px,5.1vw,67px);z-index:1}
.hero-label{color:#c9e29a;font-size:13px;font-weight:750;margin-bottom:13px}
.hero h1{font-size:clamp(35px,4.3vw,68px);line-height:1.11;letter-spacing:-.062em;margin-bottom:17px;word-break:keep-all}
.hero-text>p:not(.hero-label){color:#cfddd1;max-width:325px;word-break:keep-all}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:23px}
.button{border:1px solid #c8d2c8;background:var(--paper);border-radius:8px;padding:8px 13px;min-height:38px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--ink);font-weight:700;white-space:nowrap}
.button:hover{background:#e8f0e6;border-color:#a9c2b0}
.button.small{min-height:32px;padding:5px 10px;font-size:12px}
.button.primary{background:#28563f;color:#fff;border-color:#28563f}
.button.primary:hover{background:#1e4332}
.hero .button{background:#2b4939;color:#f5faeb;border-color:#57725e}
.hero .button:hover{background:#395849}
.hero .button.primary{background:var(--bright);color:#223622;border-color:var(--bright)}
.hero .button.primary:hover{background:#e3f6ba}
.hero-visual{position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 70% 26%,#567354 0,transparent 57%),linear-gradient(130deg,#284133,#355644)}
.hero-visual::before{position:absolute;inset:0;content:"";background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(200,230,187,.10) 24px 25px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(200,230,187,.10) 24px 25px);mask-image:linear-gradient(100deg,transparent,#000 45%);}
.hero-orbit{position:absolute;aspect-ratio:1;border:1px solid #718c71;border-radius:50%;pointer-events:none}
.orbit-a{width:450px;top:-70px;right:-120px}
.orbit-b{width:355px;top:-20px;right:-75px}
.orbit-c{width:260px;top:25px;right:-20px;border-style:dashed}
.hero-demo{position:relative;width:min(76%,320px);color:#26382d;border:1px solid #d3dfcb;border-radius:15px;background:#edf4e6;box-shadow:11px 18px 44px #11281f8c;overflow:hidden}
.hero-demo-head,.hero-demo-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;font-size:12px;font-weight:750}
.hero-demo-head{border-bottom:1px solid #d7dfcf}
.hero-demo-head span:first-child{display:flex;align-items:center;gap:7px}
.hero-demo-head b{width:7px;height:7px;border-radius:50%;background:#57865e}
.hero-demo-head span:last-child{font:10px var(--mono);color:#54745f}
.hero-demo-space{height:130px;position:relative;display:grid;place-items:center;background:repeating-linear-gradient(90deg,transparent 0 26px,#dce7d7 27px 28px),repeating-linear-gradient(0deg,transparent 0 26px,#dce7d7 27px 28px)}
.hero-axis{position:absolute;left:19%;right:18%;border-bottom:1px dashed #547d63}
.hero-target{position:absolute;width:50px;height:50px;border:1px solid #82a189;border-radius:50%;margin-left:37%}
.hero-spring{height:56px;width:56px;position:relative;border:0;border-radius:50%;color:#234130;background:var(--bright);box-shadow:0 4px 0 #6c8a58;font-size:24px;margin-left:37%}
.hero-demo-foot{background:#fcfdf6;font-size:10px;color:#53715a}
.hero-demo-foot a{color:#285740}
.home-links,.home-library{margin-top:27px}
.minor-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:11px}
.minor-head h2{font-size:20px}
.minor-head a{font-size:12px;color:#325e49;white-space:nowrap}
.journeys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.journeys a{background:var(--paper);border:1px solid var(--line);padding:15px;min-width:0;border-radius:13px;text-decoration:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.journeys a:hover{border-color:#8eb39d;background:#f9fbf3}
.journey-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;font-size:23px;color:#2a4d3a}
.component-icon{background:#dfede1}
.style-icon{background:#f0e7d3}
.motion-icon{background:#e2e4ed}
.journeys strong{display:block;font-size:15px;margin-bottom:1px;letter-spacing:-.03em}
.journeys small{display:block;color:var(--muted);font-size:11px;line-height:1.35;word-break:keep-all}
.arrow{color:#527962;font-size:17px;align-self:start}
.library-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.library-links a{display:flex;justify-content:space-between;border-top:1px solid var(--line);text-decoration:none;padding:10px 0;color:#405a4a}
.library-links a:hover{color:#192f24}
.library-links a span:last-child{font:12px var(--mono);color:#56755f}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:13px;margin:4px 0 22px}
.section-head h1{font-size:clamp(30px,4.1vw,56px);margin-bottom:7px}
.section-head p{color:var(--muted);font-size:14px;max-width:64ch}
.catalog-tools{border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:12px 15px}
.filter-tabs,.catalog-search,.related-links,.head-actions,.reference-nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.filter-tabs{padding-bottom:11px;border-bottom:1px solid #edf0ea}
.filter-tabs button,.reference-nav a{border:1px solid transparent;background:transparent;color:var(--muted);padding:6px 10px;border-radius:7px;text-decoration:none;font-weight:700;min-height:34px}
.filter-tabs button[aria-pressed=true],.reference-nav a[aria-current=page]{color:#244832;background:var(--soft);border-color:#b8d4c0}
.catalog-search{padding-top:11px;font-size:13px}
.catalog-search>label:first-child{flex:1;min-width:min(210px,100%)}
.catalog-search input[type=search]{width:100%}
.inline-choice{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.result-count{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 8px}
.entry-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.entry-card{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr);gap:11px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:14px;min-height:186px}
.entry-card:hover{border-color:#a6bda9}
.entry-sign{width:40px;height:40px;display:grid;place-items:center;border-radius:9px;background:var(--soft);color:#355b46;font-size:22px}
.glyph-style{background:#f0e7d3;color:#775c2d}
.glyph-motion{background:#e3e9e6;color:#365d52}
.glyph-effect{background:#ece7ef;color:#613f6b}
.entry-body{display:flex;flex-direction:column;min-width:0}
.entry-kind{font-size:10px;font-weight:750;color:#58705e;padding-right:23px}
.entry-card h2{font-size:17px;margin-top:2px;padding-right:16px}
.entry-card h2 a{text-decoration:none}
.entry-card h2 a:hover{text-decoration:underline}
.english{font-size:11px;color:#4d6353;margin:2px 0 7px}
.entry-card p:not(.english){font-size:12px;color:var(--muted);line-height:1.45;word-break:keep-all}
.entry-footer{margin-top:auto;padding-top:9px;display:flex;gap:7px;align-items:center;font-size:10px;color:#496451}
.entry-status{display:inline-block;border:1px solid #ced8cc;border-radius:5px;font-size:10px;font-weight:700;padding:1px 5px;color:#51675a;background:#f6f6ed;white-space:nowrap}
.entry-status.ready{background:#e7f2e4;border-color:#cadecd;color:#285d43}
.favorite-button{width:35px;height:35px;border:1px solid #ccd7cb;border-radius:9px;color:#5c745f;background:var(--paper);font-size:20px;line-height:1;display:grid;place-items:center}
.favorite-button:hover,.favorite-button[aria-pressed=true]{color:#385f49;background:#e6f0df}
.entry-card>.favorite-button{position:absolute;top:12px;right:10px;width:27px;height:27px;font-size:17px}
.empty-page{padding:28px;border:1px dashed var(--line);border-radius:11px;color:var(--muted);grid-column:1/-1}
.detail-return{display:flex;justify-content:space-between;font-size:12px;color:#4a6752;margin-bottom:10px}
.detail-return span,.topic-kicker,.motion-description h2 span{font:11px var(--mono);color:#59705f}
.topic-kicker{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.detail-head{margin-bottom:19px}
.detail-layout{display:grid;gap:15px}
.detail-layout.with-demo{grid-template-columns:minmax(0,1.14fr) minmax(0,.86fr)}
.read-card,.demo-wrap,.detail-more,.lab-play,.lab-settings,.reference-list article,.archive-box{border:1px solid var(--line);border-radius:13px;padding:17px;background:var(--paper)}
.read-card h2,.detail-more h2,.lab-settings h2{font-size:16px;margin-bottom:5px}
.read-card p{margin-bottom:12px;color:var(--muted)}
.read-card .definition{color:var(--ink);font-size:17px;font-weight:650}
.read-card a.button{margin:0 0 12px}
.demo-wrap{padding:0;overflow:hidden}
.component-demo{padding:21px;min-height:226px;border-radius:0!important}
.component-demo [data-demo-mount]{max-width:540px;margin:auto}
.detail-more{margin-top:15px}
.detail-more p:not(.quiet){margin-bottom:5px;color:var(--muted)}
.related-links{margin:9px 0}
.source-links{list-style:none;display:flex;gap:5px 12px;flex-wrap:wrap;padding:0;margin:8px 0;color:#38634b;font-size:12px}
.quiet{color:var(--muted);font-size:12px}
.lab-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(255px,.7fr);gap:13px;align-items:start}
.lab-play{padding:0;overflow:hidden}
.lab-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px;justify-content:space-between;background:#eff2e8;border-bottom:1px solid var(--line);padding:9px 12px;font-size:12px;font-weight:750}
.lab-top select{padding:4px 7px;margin-left:3px;font-size:12px}
.motion-entry{display:flex;align-items:end;gap:12px;margin-bottom:12px}
.motion-entry>div:first-child{display:grid;gap:4px;max-width:min(305px,39%)}
.motion-entry label{font-size:12px;font-weight:750;color:var(--muted)}
.motion-entry h2{font-size:22px}
.motion-entry p{color:var(--muted);font-size:13px}
.motion-entry .favorite-button{margin-left:auto;flex:none}
.lab-stages{display:grid;grid-template-columns:minmax(0,1fr)}
.lab-stages.comparing{grid-template-columns:repeat(2,minmax(0,1fr))}
.motion-stage{height:247px;min-width:0;overflow:hidden;position:relative;display:grid;place-items:center;background-color:#eaf1e7;background-image:linear-gradient(90deg,#d7e3d7 1px,transparent 1px),linear-gradient(#d7e3d7 1px,transparent 1px);background-size:23px 23px;text-align:center}
.motion-stage+.motion-stage{border-left:1px solid #c4d5c7;background-color:#eaf1eb}
.motion-object,.motion-flip,.motion-ripple{min-width:104px;min-height:64px;border-radius:13px;background:#305f48;color:#fff;font-size:15px;font-weight:750;display:grid;place-items:center;padding:10px;position:relative;z-index:1}
.motion-object{box-shadow:0 5px 18px #204a354a}
.motion-flip{transform-style:preserve-3d}
.motion-flip>span{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;border-radius:inherit}
.motion-flip>span+span{color:#213a2d;background:#c8e4a6;transform:rotateY(180deg)}
.motion-check{width:84px;height:84px;display:grid;place-items:center;border-radius:14px;background:#d5eac8;border:2px solid #598463;color:#214733;font-size:58px;line-height:1}
.motion-text{color:#234a35;font:clamp(14px,2.5vw,30px) var(--mono);font-weight:750;max-width:80%;overflow-wrap:anywhere;min-height:1lh}
.motion-progress{width:67%;height:16px;background:#d1dfd2;border-radius:99px;overflow:hidden}
.motion-progress>div{height:100%;background:#3f8061;border-radius:inherit}
.stage-count{position:absolute;top:calc(50% + 15px);font:12px var(--mono);color:#305c44}
.motion-tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);width:80%;background:var(--paper);border-radius:10px;padding:11px 0 13px;overflow:hidden}
.motion-tabs>i{position:absolute;bottom:0;left:0;width:33.3333%;height:5px;background:#367559}
.motion-skeleton{width:67%;height:82px;border-radius:12px;position:relative;background:#cbdad0;overflow:hidden}
.motion-skeleton i{display:block;height:100%;width:40%;position:absolute;background:linear-gradient(90deg,transparent,#fff,transparent)}
.motion-list{display:grid;gap:6px;width:60%}
.demo-parallax-back{position:absolute;inset:19% 16%;border-radius:13px;background:linear-gradient(140deg,#7eab97,#b6d8bb 56%,#7c9eac);border:2px solid #537c70}
.demo-parallax-front{position:relative;z-index:1;background:#294f3b;color:#fff;padding:18px 24px;border-radius:10px;font-weight:750;box-shadow:0 8px 16px #24433647}
.demo-item{background:var(--paper);color:var(--ink);min-height:20px;padding:4px 14px;border:1px solid #ccdace;border-radius:5px;text-align:left;font-size:11px}
.particle-origin{position:absolute;top:50%;left:50%;z-index:2;pointer-events:none}
.particle-origin i{display:block;position:absolute;width:7px;height:7px;border-radius:2px;background:#cf6737}
.particle-origin i:nth-child(3n){background:#4c9864}
.particle-origin i:nth-child(3n+1){background:#ad7a2b}
.motion-ripple{overflow:hidden;isolation:isolate}
.motion-ripple i{position:absolute;width:84px;height:84px;border-radius:50%;background:#d5ed9d;pointer-events:none}
.motion-ripple span{z-index:1}
.shared-guides{position:absolute;inset:0}
.shared-guides i{position:absolute;width:67px;height:57px;top:calc(50% + 7px);left:calc(50% - 114px);border:1px dashed #40684f;border-radius:8px}
.shared-guides i+i{top:calc(50% - 75px);left:calc(50% + 10px);width:123px;height:84px}
.snap-content{display:flex;width:min(72%,360px);overflow:auto;scroll-snap-type:x mandatory;border-radius:8px}
.snap-content span{flex:0 0 100%;scroll-snap-align:start;padding:27px 5px;background:#cee4d2;color:#244b36}
.snap-content span:nth-child(2){background:#f3ead4}
.snap-content span:nth-child(3){background:#dbe6eb}
.snap-buttons{position:absolute;bottom:19px;display:flex;gap:5px}
.snap-buttons button{border:1px solid #afc8b3;border-radius:5px;background:var(--paper);color:var(--ink);min-width:29px}
.snap-buttons button[aria-pressed=true]{background:#386953;color:#fff}
.compare-label{position:absolute;top:8px;right:8px;background:var(--paper);border:1px solid var(--line);padding:2px 7px;border-radius:5px;font-size:11px}
.timeline{padding:12px;border-top:1px solid var(--line)}
.timeline>div:first-child,.lab-control>div{display:flex;justify-content:space-between;gap:6px}
.timeline label,.lab-control label{font-weight:700}
.timeline output,.lab-control output{font:11px var(--mono);color:#486250;align-self:center}
.transport,.lab-copy{display:flex;flex-wrap:wrap;gap:5px}
.reduced-note{padding:0 12px 10px}
.lab-settings{padding:13px}
.lab-settings h2{margin-bottom:2px}
.lab-settings form{display:grid;gap:0}
.lab-control{font-size:12px;border-bottom:1px solid #e9eee7;padding:6px 0;display:grid;gap:3px}
.lab-control.inline{display:flex;align-items:center;justify-content:space-between;gap:4px}
.lab-control input[type=range]{min-height:18px}
.lab-control select{font-size:11px;padding:4px 5px;max-width:63%}
.curve-wrap{margin:10px 0 8px;border:1px solid #d6e0d4;background:#f5f8ef;border-radius:6px;padding:5px;font-size:11px;text-align:right;color:#43634f}

  --s-alt: #262c44;
  --s-input: #181d30;
  --s-line: #39405a;
  --s-ink: #f3f4fc;
  --s-muted: #b2bbd4;
  --s-accent: #aeb8ff;
  --s-on-accent: #1b2248;
}
body.collection .rail {
  width: var(--library-rail);
  padding: 28px 18px 20px;
  border-right: 1px solid var(--s-line);
}
body.collection .brand { padding: 1px 3px 29px; font-size: 26px; gap: 11px; }
body.collection .brand small { color: inherit; opacity: .8; font-size: .65rem; letter-spacing: .12em; }
body.collection .brand-mark { overflow: hidden; position: relative; display: grid; place-items: center; }
.brand-mark i { width: 16px; height: 19px; border: 1.5px solid currentColor; border-radius: 4px; position: absolute; }
.brand-mark i:first-child { transform: translate(-3px, -3px); opacity: .56; }
.brand-mark i:last-child { transform: translate(3px, 3px); background: color-mix(in srgb,var(--s-accent) 70%,transparent); }
body.collection .rail nav a { font-size: .875rem; min-height: 43px; opacity: 1; }
body.collection .rail nav a>span { font-size: 1.125rem; text-align: center; opacity: .8; }
body.collection .rail nav a[aria-current=page] { font-weight: 750; }
body.collection .rail nav a:hover { transform: none; }
body.collection .rail .nav-children { margin-left: 21px; padding-left: 12px; }
body.collection .rail .nav-children a { font-size: .875rem; opacity: .88; min-height: 34px; }
body.collection[data-theme=flat2]:not([data-dark=true]) .rail nav a[aria-current=page] { color: #343ba0; }
body.collection .rail-footer { align-items: flex-start; justify-content: flex-start; flex-wrap: wrap; font-size: .75rem; }
body.collection .rail-source-link { font-size: .78rem; }
.mobile-groups { display: none; }
body.collection .page { margin-left: var(--library-rail); }
body.collection .topbar {
  padding: 0 var(--library-pad);
  min-height: 66px;
  height: auto;
  background: var(--s-bar);
  -webkit-backdrop-filter: blur(17px) saturate(1.2);
  backdrop-filter: blur(17px) saturate(1.2);
}
body.collection .top-brand { margin-right: auto; }
body.collection .top-brand strong { font-size: .94rem; }
body.collection .top-style-strip { flex: 0 1 auto; order: 0; }
body.collection .top-style-strip button { font-size: .875rem; }
body.collection .top-actions { gap: 8px; margin-left: 0; }
body.collection #global-search[data-expanded=false] { width: auto; padding: 0; }
body.collection #search-expand {
  display: inline-flex; align-items: center; gap: 8px; width: auto; min-height: 37px;
  padding: 0 10px; font-size: .875rem; white-space: nowrap; border-radius: 9px;
}
.search-icon { width: 12px; height: 12px; margin-right: 2px; border: 1.5px solid currentColor; border-radius: 50%; position: relative; }
.search-icon::after { content: ""; position: absolute; width: 5px; height: 1.5px; background: currentColor; right: -4px; bottom: -2px; transform: rotate(45deg); }
body.collection #global-search[data-expanded=true] #search-expand { padding: 0 7px; }
#global-search[data-expanded=true] #search-expand span { display: none; }
body.collection .topbar #drawer-handle {
  position: static; display: grid; place-items: center; flex: 0 0 38px; width: 38px; height: 38px;
  border: 1px solid var(--s-line); border-radius: 9px; box-shadow: none;
  background: var(--s-card); color: var(--s-ink); font-size: 20px; line-height: 1;
}
body.collection .topbar #drawer-handle:hover { transform: none; background: var(--s-alt); }
body.collection .topbar #drawer-handle span { transform: none; }
body.collection main { padding: 27px var(--library-pad) 110px; max-width: 1510px; }
body.collection .section-head { margin-bottom: 24px; }
body.collection .section-head h1 { font-size: clamp(2rem,3.5vw,3.15rem); }
body.collection .section-head p:not(.u-kicker) { font-size: 1rem; }

.catalog-intro {
  --hero-ink: #17234a;
  --hero-muted: #3d4b73;
  --hero-line: #cfd9f0;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr); gap: clamp(18px, 3vw, 48px);
  align-items: center; padding: clamp(22px, 2.45vw, 35px); margin: 0 0 22px;
  border: 1px solid var(--hero-line); border-radius: 24px; color: var(--hero-ink);
  background: radial-gradient(ellipse at 84% 35%, #d5ddff, transparent 62%), linear-gradient(115deg,#f3f6ff 0%,#e6edfe 65%,#e9e6ff);
}
[data-dark=true] .catalog-intro {
  --hero-ink: #f0f3ff; --hero-muted: #c2cee9; --hero-line: #424b72;
  background: radial-gradient(ellipse at 88% 20%,#323e76,transparent 68%),linear-gradient(115deg,#1b233d,#232941);
}
.catalog-intro .catalog-label {
  color: var(--hero-muted); margin: 0 0 13px; font-size: .76rem; font-weight: 750; letter-spacing: .15em;
}
.catalog-intro h1 {
  color: var(--hero-ink); margin: 0 0 12px; font-size: clamp(2.45rem, 3.8vw, 3.5rem);
  font-weight: 800; line-height: 1.075; letter-spacing: -.075em; overflow-wrap: anywhere;
}
.catalog-intro-copy > p:not(.catalog-label) { font-size: 1rem; line-height: 1.63; color: var(--hero-muted); margin: 0 0 18px; }
.catalog-intro .intro-link {
  display: inline-flex; align-items: center; min-height: 39px; padding: 0 13px; border-radius: 9px;
  border: 1px solid var(--hero-line); background: color-mix(in srgb,var(--s-card) 75%,transparent);
  color: var(--hero-ink); font-weight: 700; font-size: .875rem; text-decoration: none;
}
.catalog-intro .intro-link:hover { background: color-mix(in srgb,var(--s-card) 94%,transparent); }
.catalog-intro-demo { min-width: 0; }
.catalog-intro-caption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 1px 8px; font-size: .94rem; }
.catalog-intro-caption span { color: var(--hero-muted); font-size: .8rem; }

.glass-sample {
  width: min(100%, 250px); padding: 12px 15px 11px; border-radius: 17px; color: #141e3e;
  border: 1px solid #ffffffb5; background: color-mix(in srgb,#f2f5ff var(--sample-opacity),transparent);
  box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 #ffffff40, 0 12px 29px #161b6350;
  -webkit-backdrop-filter: blur(var(--sample-blur)) saturate(1.22);
  backdrop-filter: blur(var(--sample-blur)) saturate(1.22);
}
.glass-scene[data-material=solid] .glass-sample { background: #f2f5ff; -webkit-backdrop-filter: none; backdrop-filter: none; }
.glass-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; min-width: 0; padding: 3px; margin: 0 0 9px; background: #1a28651b; border: 0; border-radius: 9px; }
.glass-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.glass-switch span { display: grid; min-height: 28px; padding: 2px 5px; place-items: center; font-size: .875rem; font-weight: 700; border-radius: 6px; cursor: pointer; }
.glass-switch input:checked + span { background: #ffffffd9; box-shadow: 0 1px 4px #2532632b; }
.glass-switch input:focus-visible + span { outline: 2px solid #2d36ab; outline-offset: -2px; }
.glass-range { display: grid; gap: 1px; margin-top: 4px; font-size: .875rem; font-weight: 700; }
.glass-range > span { display: flex; flex-wrap: wrap; gap: 3px 7px; justify-content: space-between; }
.glass-range output { color: #182555; font-size: .8125rem; font-variant-numeric: tabular-nums; }
.glass-range input[type=range] { width: 100%; margin: 0; accent-color: #3e47b5; min-height: 20px; }

body.collection .u-catalog-tools { margin: 0; border: 0; box-shadow: none; }
body.collection .u-filter-search > .u-search-inline { flex: 1 0 min(250px, 100%); }
body.collection .u-search-inline input { min-height: 42px; font-size: .92rem; }
body.collection .u-small-filter, body.collection .u-catalog-tools .u-checkline, body.collection .u-catalog-tools .u-action { font-size: .875rem; }
body.collection .u-catalog-tools .u-checkline { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
body.collection .u-catalog-tools .u-checkline input { width: 16px; height: 16px; margin: 0; flex: none; }
.catalog-status { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.catalog-status [hidden] { display: none; }
body.collection .result-count, .u-section-count { font-size: .8125rem; }
body.collection .u-section-title { padding-bottom: 10px; margin-bottom: 14px; align-items: center; }
body.collection .u-section-title h2 { font-size: 1.25rem; }
body.collection .u-section-title p { font-size: .875rem; }
body.collection .u-featured .u-gallery { grid-template-columns: repeat(3,minmax(0,1fr)); }
body.collection .u-gallery { gap: 16px; grid-template-columns: repeat(2,minmax(0,1fr)); }
body.collection .u-demo-card { min-width: 0; border-radius: var(--s-radius); }

.form-segments input:checked + span { background: var(--s-card); color: var(--s-ink); font-weight: 750; box-shadow: 0 1px 4px #14264320; }
.form-segments input:focus-visible + span { outline: 2px solid var(--s-accent); }
.lesson-section { margin-top: clamp(22px,3vw,36px); }
.lesson-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,230px),1fr)); gap: 12px; }
.lesson-card {
  display: flex; flex-direction: column; min-width: 0; padding: 12px 15px 14px;
  border: 1px solid var(--s-line); background: var(--s-card); border-radius: var(--s-radius);
}
.lesson-card-title { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 7px; }
.lesson-card h3 { margin: 0; font-size: 1rem; }
.lesson-card .lesson-term { color: var(--s-muted); font-size: .8125rem; margin-top: 2px; }
.lesson-card p { color: var(--s-ink); margin: 5px 0 0; font-size: .875rem; }
body.collection .lesson-spotlight { width: 36px; height: 36px; background: var(--s-alt); }
body.collection .lesson-spotlight:hover { color: var(--s-accent); }
.lesson-controls { padding-top: 8px; margin-top: auto; }
.lesson-card .mobile-rail-note { display: none; color: var(--s-muted); }
.responsive-guide {
  margin: 24px 0; padding: clamp(13px,2vw,22px); border: 1px solid var(--s-line);
  border-radius: var(--s-radius); background: var(--s-card);
}
.responsive-guide h2 { margin: 0; font-size: 1.08rem; }
.responsive-guide h2 span { font-size: .8125rem; font-weight: 600; color: var(--s-muted); }
.responsive-guide p { max-width: 57ch; margin: 5px 0 10px; color: var(--s-muted); font-size: .92rem; }
body.collection .lesson-button { font-size: .82rem; min-height: 34px; }
body.collection .lesson-button > svg { width: 16px; height: 16px; }
.lesson-section > .u-section-title a, .component-tools a, .item-related a, .layout-motion-links a { color: var(--s-accent); font-size: .85rem; }
.layout-motion-links, .item-related { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.split-sample { display: grid; grid-template-columns: minmax(0,var(--split)) minmax(0,1fr); min-height: 81px; gap: 4px; margin-bottom: 7px; }
.split-sample span, .master-detail-sample p { padding: 12px 8px; border: 1px solid var(--s-line); border-radius: 7px; background: var(--s-card); font-size: .875rem; }
.master-detail-sample { display: grid; grid-template-columns: minmax(70px,.37fr) minmax(0,1fr); gap: 8px; }
.master-detail-sample .master-list { display: grid; gap: 4px; }
.master-detail-sample p { margin: 0; }
.material-comparison { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; margin-bottom: 8px; }
.material-comparison figure { margin: 0; min-width: 0; }
.material-comparison figcaption { font-size: .79rem; margin-top: 4px; }

.material-example > div {
  border-radius: 7px; padding: 6px; border: 1px solid #fff9;
  background: #f6f7ff; color: #18264b; font-weight: 750; font-size: .75rem;
}
.material-example:is(.single-material,.glass-system) > div {
  background: color-mix(in srgb,#e8efff var(--tile-opacity,62%),transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 4px 10px #273a6742;
}
.glass-system :is(i,b) { position: absolute; display: block; border-radius: 5px; background: #f0f4ff88; backdrop-filter: blur(7px); border: 1px solid #ffffff95; }
.glass-system i { inset: 6px 7px auto; height: 13px; }
.glass-system b { top: 25px; left: 7px; bottom: 7px; width: 14%; }
.glass-system > div { margin-left: 15%; }

#spotlight-dialog {
  position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0;
  background: rgba(0,0,0,.03); color: var(--s-ink); border: 0; overflow: hidden;
}
#spotlight-dialog::backdrop { background: transparent; }
#spotlight-dialog[open] { animation: spotlight-in 170ms ease-out; }
.spotlight-ring {
  position: absolute; pointer-events: none; border: 2px solid #9bafff; border-radius: 12px;
  box-shadow: 0 0 0 200vmax #101632b4,inset 0 0 0 2px #ffffff70,0 0 18px #8ea6ff75;
}
.coach-mark {
  position: absolute; width: min(362px,calc(100vw - 28px)); max-height: calc(100dvh - 27px); overflow: auto;
  padding: 16px; border: 1px solid var(--s-line); border-radius: max(14px,var(--s-radius));
  background: var(--s-card); box-shadow: 0 16px 55px #080e4380; animation: coach-in 210ms var(--atlas-ease);
}
@keyframes spotlight-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes coach-in { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
.coach-mark header { display: flex; align-items: flex-start; justify-content: space-between; gap: 9px; margin-bottom: 9px; }
.coach-mark header p { color: var(--s-accent); margin: 0 0 2px; font-size: .82rem; font-weight: 750; }
.coach-mark h2 { margin: 0; font-size: 1.15rem; }
.coach-mark .coach-close:focus { outline: 2px solid var(--s-accent); outline-offset: 2px; }
.coach-definition { margin: 0 0 10px; }
.coach-mark dl { margin: 0; font-size: .86rem; }
.coach-mark dl > div { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 8px; padding: 7px 0; border-top: 1px solid var(--s-line); }
.coach-mark dt { color: var(--s-muted); font-weight: 720; }
.coach-mark dd { margin: 0; }
.coach-related { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.coach-related a { font-size: .8rem; padding: 4px 7px; border-radius: 6px; background: var(--s-alt); color: var(--s-accent); text-decoration: none; }
.coach-related a:hover { text-decoration: underline; }
.coach-mark footer { display: flex; justify-content: flex-end; align-items: center; gap: 7px; margin-top: 12px; }

  function selectInputVariant(button){
    const f=button.dataset.inputFamily,key=button.dataset.inputVariant;
    const studio=button.closest('.u-input-studio');if(!studio)return;
    const item=A.components.find(x=>x.key===key);if(!item)return;

    studio.querySelectorAll('[data-input-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    studio.querySelector('[data-input-detail]').innerHTML=inputDescription(item);

    mountCard(host);
  }
  function copySingleItem(id,preset){
    const item=A.byId.get(id);if(!item)return;
    const s=selectedStyle(),opts=preset?A.motion.presetOptions(item,preset):A.motionSettings[id]||A.motion.defaults(item);
    const txt=`UI2YA | motion=${item.en} | target=chosenUI | style=${s.en} | trigger=${preset?.trigger||'stateChange'} | params=${JSON.stringify(opts)}${preset?' | preset='+preset.name:''} | prefers-reduced-motion=respect`;

  function setAccent(value){state.colors[state.style]=hexColor(value);applyTheme();}
  document.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b)return;
    if(b.dataset.selectStyle){chooseStyle(b.dataset.selectStyle);return;}
    if(b.dataset.mode){state.mode=b.dataset.mode;applyTheme();return;}

    if(b.dataset.resetStyle!==undefined){delete state.colors[state.style];delete state.backgrounds[state.style];delete state.surfaces[state.style];state.opacity=76;state.blur=15;applyTheme();notify('현재 디자인의 색상·재질 설정 복원');return;}
    if(b.dataset.kind){location.hash='catalog/'+b.dataset.kind;return;}
    if(b.dataset.inputVariant){selectInputVariant(b);return;}
    if(b.dataset.copyItem){copySingleItem(b.dataset.copyItem,presetById.get(b.dataset.copyPreset));return;}
    if(b.dataset.componentGroup){selectComponentGroup(b.dataset.componentGroup,true);return;}
    if(b.dataset.clearFilter!==undefined){Object.assign(filters,{query:'',difficulty:'all',ready:false});if(ui('[data-catalog-search]'))ui('[data-catalog-search]').value='';if(ui('[data-difficulty]'))ui('[data-difficulty]').value='all';if(ui('[data-ready]'))ui('[data-ready]').checked=false;refreshCatalog();return;}

    if(b.dataset.add){addToPrompt(b.dataset.add,b);return;}
    if(b.dataset.composeComponent){combineComponent(b.dataset.composeComponent,b);return;}
    if(b.hasAttribute('data-add-design')){addToPrompt(selectedStyle().id,b);return;}
    if(b.hasAttribute('data-copy-design')){A.copy('UI2YA | '+Object.entries(designContext()).map(([key,value])=>key+'='+value).join(' | '),ui('#prompt-output'));return;}
    if(b.dataset.pausePreviews!==undefined){state.paused=!state.paused;previewController?.sync();b.textContent=previewLabel();store();return;}
    if(b.dataset.remove){
      const id=b.dataset.remove,prompt=state.prompt;
      prompt.components=prompt.components.filter(item=>item!==id);
      prompt.motions=prompt.motions.filter(item=>item!==id);
      const removed=A.byId.get(id);
      delete prompt.examples[id];
      if(removed?.kind==='motion'){
        for(const [key,value] of Object.entries(prompt.examples))if(value.interaction===removed.en)delete prompt.examples[key];
      }
      if(prompt.preset===id)prompt.preset=null;
      updatePrompt();store();
      return;
    }
  });
  main.addEventListener('input',e=>{const el=e.target;
    if(el.name==='sample-material'){
      const scene=el.closest('.glass-scene');
      scene.dataset.material=el.value;
      scene.querySelectorAll('[data-sample]').forEach(control=>control.disabled=el.value==='solid');
    }
    if(el.dataset.sample){
      const property=el.dataset.sample;
      const scene=el.closest('.glass-scene');
      const value=el.value+(property==='blur'?'px':'%');
      scene.style.setProperty(`--sample-${property}`,value);
      scene.querySelector(`[data-sample-value="${property}"]`).textContent=value;
    }
    if(el.matches('[data-catalog-search]')){filters.query=el.value;refreshCatalog();}
    if(el.matches('[data-difficulty]')){filters.difficulty=el.value;refreshCatalog();}
    if(el.matches('[data-ready]')){filters.ready=el.checked;refreshCatalog();}
    if(el.matches('[data-editor-accent]'))setAccent(el.value);
    if(el.matches('[data-editor-bg]')){state.backgrounds[state.style]=hexColor(el.value);applyTheme();}
    if(el.matches('[data-editor-surface]')){state.surfaces[state.style]=hexColor(el.value);applyTheme();}
    if(el.matches('[data-editor-opacity]')){state.opacity=+el.value;applyTheme();}
    if(el.matches('[data-editor-blur]')){state.blur=+el.value;applyTheme();}
    if(el.matches('[data-editor-density]')){state.density=el.value;applyTheme();}
    if(el.matches('[data-editor-mode]')){state.mode=el.value;applyTheme();}
  });
  function selectComponentGroup(key,focus){
    const next='catalog/component'+(key==='all'?'':'/'+key);
    if(location.hash.slice(1)===next)return;
    tabFocus=focus?key:'';
    location.hash=next;
  }
  main.addEventListener('keydown',event=>{
    const tab=event.target.closest('[data-component-group]');
    if(!tab)return;
    const groups=Object.keys(groupLabels),index=groups.indexOf(tab.dataset.componentGroup);
    const next={ArrowRight:(index+1)%groups.length,ArrowLeft:(index+groups.length-1)%groups.length,Home:0,End:groups.length-1}[event.key];
    if(next!==undefined){event.preventDefault();selectComponentGroup(groups[next],true);}
  });
  main.addEventListener('change',event=>{
    if(event.target.matches('[data-component-motion]'))A.componentMotion.setChoice(event.target);
  });
  main.addEventListener('motion-settings-change',()=>{updatePrompt();store();});
  ui('#quick-accent').addEventListener('input',e=>setAccent(e.target.value));
  
  ui('#global-search').addEventListener('submit',e=>{
    e.preventDefault();
    const query=find.value.trim();
    const next=query?'search/'+encodeURIComponent(query):'catalog/component';
    if(location.hash.slice(1)===next)return;
    location.hash=next;
  });
  ui('#dock-toggle').addEventListener('click',()=>{const open=ui('#dock-content').hidden;ui('#dock-content').hidden=!open;ui('#dock-toggle').setAttribute('aria-expanded',String(open));ui('#prompt-dock').classList.toggle('is-open',open);});
  ui('#prompt-clear').addEventListener('click',()=>{state.prompt={components:[],motions:[],examples:{},preset:null};updatePrompt();store();});
  ui('#prompt-detailed').addEventListener('change',updatePrompt);
  ui('#prompt-copy').addEventListener('click',()=>A.copy(promptText(),ui('#prompt-output')));
  document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&['k','f'].includes(e.key.toLowerCase())){e.preventDefault();window.UI2YAEnhance?.expandSearch();find.focus();find.select();}});
  window.addEventListener('hashchange',render);
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(state.mode==='system')applyTheme();});
  window.AtlasUI={state,isFavorite:id=>favorites.has(id),chooseStyle,applyTheme,themeEditor,renderStory,selectedStyle,get darkMode(){return darkMode()},get currentAccent(){return currentAccent()},notify};
  applyTheme();updatePrompt();render();
})();

'use strict';
(() => {
  const U=window.AtlasUI, A=window.Atlas;
  const $=selector=>document.querySelector(selector);
  const strip=$('#quick-styles'),drawer=$('#motion-drawer'),help=$('#ui-learn-popover');
  const settings=$('#design-popover'),settingsToggle=$('#settings-toggle');
  const styleLabels=[['flat2','모던'],['glass','글래스'],['material-you','머티리얼'],['neo-brutal','네오브루탈']];
  strip.innerHTML=styleLabels.map(([id,name])=>`<div class="style-choice"><button type="button" data-select-style="${id}" aria-pressed="false" title="${name} · Press Feedback, Surface Transition" data-help="style-motion">${name}</button><button type="button" class="style-info" data-style-info="${id}" aria-controls="motion-drawer" aria-expanded="false" aria-label="${name} 스타일 설명">?</button></div>`).join('');
  $('#design-editor').innerHTML=U.themeEditor();
  A.icons.decorate(document);

  let describedStyle='',drawerOpener;
  const drawerIsOpen=()=>document.body.classList.contains('is-drawer-open');
  const settingsIsOpen=()=>settings.matches(':popover-open');
  function sync(){
    const open=drawerIsOpen();
    strip.querySelectorAll('[data-style-info]').forEach(button=>button.setAttribute('aria-expanded',String(open&&button.dataset.styleInfo===describedStyle)));
    $('.topbar .u-mode').style.setProperty('--mode-index',Math.max(0,['system','light','dark'].indexOf(U.state.mode)));
    const mode=$('[data-editor-mode]');
    if(mode)mode.value=U.state.mode;
    A.layoutLab.sync();
  }
  function openStyle(key,focus=true,opener=null){
    if(settingsIsOpen())setSettings(false);
    describedStyle=key;
    drawerOpener=opener;
    U.renderStory(key);
    drawer.scrollTop=0;
    drawer.inert=false;
    drawer.setAttribute('aria-hidden','false');
    document.body.classList.add('is-drawer-open');
    sync();
    if(focus)$('#drawer-close').focus({preventScroll:true});
  }
  function closeStyle(restoreFocus=true){
    if(!drawerIsOpen())return;
    document.body.classList.remove('is-drawer-open');
    drawer.inert=true;
    drawer.setAttribute('aria-hidden','true');
    describedStyle='';
    sync();
    if(restoreFocus)drawerOpener?.focus({preventScroll:true});
  }
  strip.addEventListener('click',event=>{
    const button=event.target.closest('[data-style-info]');
    if(!button)return;
    const key=button.dataset.styleInfo;
    if(drawerIsOpen()&&key===describedStyle)closeStyle();
    else openStyle(key,true,button);
  });
  $('#drawer-close').addEventListener('click',()=>closeStyle());
  drawer.addEventListener('click',event=>{if(event.target.closest('a[href^="#"]'))closeStyle(false);});

  function positionSettings(){
    if(!settingsIsOpen())return;
    const rect=settingsToggle.getBoundingClientRect();
    const margin=10;
    const below=innerHeight-rect.bottom-2*margin;
    const above=rect.top-2*margin;
    const useBelow=below>=250||below>=above;
    const available=useBelow?below:above;
    settings.style.maxHeight=(available>=180?available:innerHeight-2*margin)+'px';
    const left=Math.max(margin,Math.min(rect.right-settings.offsetWidth,innerWidth-settings.offsetWidth-margin));
    const top=available<180?margin:useBelow?rect.bottom+margin:rect.top-settings.offsetHeight-margin;
    settings.style.left=left+'px';
    settings.style.top=top+'px';
  }
  function setSettings(open){
    if(open&&!settingsIsOpen()){
      closeStyle(false);
      settings.showPopover({source:settingsToggle});
      positionSettings();
    }
    if(!open&&settingsIsOpen())settings.hidePopover();
  }
  settingsToggle.addEventListener('click',event=>{
    event.preventDefault();
    setSettings(!settingsIsOpen());
  });
  settings.addEventListener('toggle',()=>{
    const open=settingsIsOpen();
    settingsToggle.setAttribute('aria-expanded',String(open));
    if(open){closeStyle(false);positionSettings();}
  });
  settings.addEventListener('input',event=>{
    const control=event.target;
    if(control.matches('[data-editor-accent]'))U.state.colors[U.state.style]=control.value;
    else if(control.matches('[data-editor-bg]'))U.state.backgrounds[U.state.style]=control.value;
    else if(control.matches('[data-editor-surface]'))U.state.surfaces[U.state.style]=control.value;
    else if(control.matches('[data-editor-opacity]'))U.state.opacity=+control.value;
    else if(control.matches('[data-editor-blur]'))U.state.blur=+control.value;
    else if(control.matches('[data-editor-mode]'))U.state.mode=control.value;
    else if(control.matches('[data-editor-density]'))U.state.density=control.value;
    else return;
    U.applyTheme();
  });
  window.addEventListener('resize',positionSettings);
  window.addEventListener('scroll',positionSettings,{passive:true});
  document.addEventListener('pointerdown',event=>{
    if($('#spotlight-dialog').open)return;
    if(settingsIsOpen()&&!settings.contains(event.target)&&!settingsToggle.contains(event.target))setSettings(false);
  },true);

  const search=$('#global-search'),find=$('#find'),toggle=$('#search-expand');
  const searchIsOpen=()=>search.dataset.expanded==='true';
  function expandSearch(focus=true){
    search.dataset.expanded='true';
    toggle.setAttribute('aria-expanded','true');
    find.tabIndex=0;
    if(focus)find.focus({preventScroll:true});
  }
  function collapseSearch(focus=true){
    search.dataset.expanded='false';
    toggle.setAttribute('aria-expanded','false');
    find.tabIndex=-1;
    if(focus)toggle.focus({preventScroll:true});
  }
  toggle.addEventListener('click',()=>expandSearch());
  $('#search-collapse').addEventListener('click',()=>collapseSearch());
  toggle.dataset.help='search';
  $('.topbar .u-mode').removeAttribute('tabindex');
  $('.topbar .u-mode').addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    const modes=[...event.currentTarget.querySelectorAll('[data-mode]')];
    const index=modes.indexOf(event.target);
    if(index<0)return;
    const next=event.key==='Home'?0:event.key==='End'?modes.length-1:(index+(event.key==='ArrowRight'?1:-1)+modes.length)%modes.length;
    event.preventDefault();
    modes[next].click();
    modes[next].focus();
  });
  document.addEventListener('keydown',event=>{
    if(event.key!=='Escape'||event.isComposing||$('#spotlight-dialog').open)return;
    if(!help.hidden){hideHelp();if(search.contains(document.activeElement)&&searchIsOpen())collapseSearch();return;}
    if(searchIsOpen()&&search.contains(document.activeElement))collapseSearch();
    else if(settingsIsOpen()){setSettings(false);settingsToggle.focus();}
    else if(drawerIsOpen())closeStyle();
  });

  const info={
    card:['컴포넌트','Component Demo','',''],
    search:['확장형 검색','Expandable Search / Expanding Search Field','검색 패턴의 이름이야. 너비는 Width Expansion으로 바뀌고 초점은 입력란으로 이동해.','MOT-0044'],
    mode:['표시 모드','Segmented Control · Sliding Indicator','지금 선택한 모드에 맞춰 선택 배경이 이동해.','MOT-0015'],
    'style-motion':['디자인 스타일 선택','Press Feedback · Surface Transition','누를 때 잠깐 작아지고, 선택한 디자인의 색과 표면이 적용돼.','MOT-0003'],
    color:['색상 견본','Color Swatch / Color Picker','원을 누르면 플랫폼에서 제공하는 색상 선택기가 열려.','CMP-0022'],
    segment:['세그먼트 컨트롤','Segmented Control · Sliding Indicator','연결된 선택지 중 하나를 선택하면 배경이 움직여.','MOT-0015'],
  };
  let pinned=false,activeHelp=null,hideTimer=0;
  const escape=A.html;
  function hideHelp(){
    clearTimeout(hideTimer);help.hidden=true;pinned=false;activeHelp=null;
  }
  function showHelp(button,pin=false){
    const meta=info[button.dataset.help];
    if(!meta)return;
    const item=button.dataset.targetId&&A.byId.get(button.dataset.targetId);
    const [name,en,description,id]=item?[item.ko,item.en,item.caution,item.id]:meta;
    clearTimeout(hideTimer);
    activeHelp=button;
    pinned=pin;
    help.innerHTML=`<strong>${escape(name)}</strong><small>${escape(en)}</small><p>${escape(description)}</p>${id?`<a href="#item/${id}">도감에서 자세히 보기</a>`:''}`;
    help.hidden=false;
    const rect=button.getBoundingClientRect();
    const left=Math.max(12,Math.min(rect.left,innerWidth-help.offsetWidth-12));
    const top=rect.bottom+help.offsetHeight+10<innerHeight?rect.bottom+7:Math.max(12,rect.top-help.offsetHeight-7);
    help.style.left=left+'px';help.style.top=top+'px';
  }
  function scheduleHide(){if(!pinned){clearTimeout(hideTimer);hideTimer=setTimeout(hideHelp,240);}}
  document.addEventListener('pointerover',event=>{
    const target=event.target.closest('[data-help]');
    if(target&&!pinned&&target!==activeHelp&&!$('#spotlight-dialog').open)showHelp(target);
  });
  document.addEventListener('pointerout',event=>{
    const target=event.target.closest('[data-help]');
    if(target&&!target.contains(event.relatedTarget))scheduleHide();
  });
  document.addEventListener('focusin',event=>{
    const target=event.target.closest('[data-help]');
    if(target&&!pinned&&!$('#spotlight-dialog').open)showHelp(target);
  });
  document.addEventListener('focusout',event=>{if(event.target.closest('[data-help]'))scheduleHide();});
  document.addEventListener('click',event=>{
    if(event.target.closest('#ui-learn-popover'))return;
    const button=event.target.closest('.u-learn[data-help]');
    if(!button){hideHelp();return;}
    if(pinned&&activeHelp===button)hideHelp();
    else showHelp(button,true);
  },true);
  help.addEventListener('pointerenter',()=>clearTimeout(hideTimer));
  help.addEventListener('pointerleave',scheduleHide);
  help.addEventListener('click',event=>{if(event.target.closest('a'))hideHelp();});
  window.addEventListener('hashchange',()=>{hideHelp();closeStyle(false);setSettings(false);});
  const header=$('.topbar');
  const measure=()=>{
    document.documentElement.style.setProperty('--chrome-height',header.offsetHeight+'px');
    document.documentElement.style.setProperty('--chrome-bottom',Math.max(74,header.offsetHeight+18)+'px');
  };
  new ResizeObserver(measure).observe(header);
  measure();
  window.UI2YAEnhance={sync,expandSearch,collapseSearch,searchIsOpen,openStyle,closeStyle,drawerIsOpen,setSettings,settingsIsOpen};
  U.applyTheme();
})();

/* UI2YA v0.4: learnable chrome details + input tooltips + sliding selection indicator. */
'use strict';
(() => {
  const q=s=>document.querySelector(s), main=q('#main');
  q('.rail-source-link').addEventListener('click',()=>{q('#ui-learn-popover').hidden=true;});
  // The HTML role=radio example is functionally a segmented control. The visual
  // selection slides inside its own shared surface rather than becoming 3 pills.
  document.addEventListener('change',e=>{
    const choice=e.target.closest('.s-segmented input[data-segment]');if(!choice)return;
    const control=choice.closest('.s-segmented');const labels=[...control.querySelectorAll('.s-segment-choice')];
    const index=labels.indexOf(choice.closest('.s-segment-choice'));
    if(index>=0)control.style.setProperty('--segment-index',`${index*100}%`);
  });
  let scheduled=false;
  const observer=new MutationObserver(()=>{
    if(scheduled)return; scheduled=true;
    requestAnimationFrame(()=>{scheduled=false;
    document.querySelectorAll('.s-segmented:not([data-init-slide])').forEach(el=>{
      el.dataset.initSlide='true';const labels=[...el.querySelectorAll('.s-segment-choice')],index=labels.findIndex(l=>l.querySelector('input')?.checked);
      el.style.setProperty('--segment-index',`${Math.max(0,index)*100}%`);
      el.dataset.help='segment';el.title='Segmented Control — 연결형 단일 선택 / Sliding Indicator — 움직이는 선택 배경';
    });
    document.querySelectorAll('[data-color-studio]').forEach(el=>{
      if(el.dataset.learnReady)return;el.dataset.learnReady='true';
      el.querySelectorAll('[data-color-tab]').forEach(button=>button.title=`Color Picker mode · ${button.textContent.trim()}`);
    });
    });
  });observer.observe(main,{childList:true,subtree:true});
  // A tooltip with a helpful cross-reference for the toolbar theme segmented control.
  q('.u-mode').dataset.help='mode';q('.u-mode').title='Segmented Control — 표시 모드 (단일 선택)';
  q('.u-color-inline').dataset.help='color';q('.u-color-inline').title='Color Swatch / Color Picker — 현재 강조색';
  q('.topbar').title='Sticky Toolbar — 스크롤 위치와 관계없이 상단에 유지되는 도구막대';
  window.UI2YA_04={version:'0.4.0'};
})();
